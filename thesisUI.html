<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Occupancy Monitor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary-text: #f8fafc;
            --accent-entry: #22c55e;
            --accent-exit: #ef4444;
            --secondary-text: #94a3b8;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-text);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .main-display {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .main-display h2 {
            margin: 0;
            font-size: 1rem;
            color: var(--secondary-text);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #current-occupancy {
            font-size: 7rem;
            font-weight: 800;
            margin: 10px 0;
            font-variant-numeric: tabular-nums;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stat-card h3 {
            font-size: 0.8rem;
            margin: 0;
            color: var(--secondary-text);
        }

        .stat-card p {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 5px 0 0 0;
        }

        .log-container {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .log-item {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .tag {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .tag-entry { background: var(--accent-entry); color: white; }
        .tag-exit { background: var(--accent-exit); color: white; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Occupancy Traffic Feed</h1>
        <p id="clock" style="color: var(--secondary-text);"></p>
    </header>

    <div class="main-display">
        <h2>Live Occupancy</h2>
        <div id="current-occupancy">0</div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total In</h3>
            <p id="total-in" style="color: var(--accent-entry);">0</p>
        </div>
        <div class="stat-card">
            <h3>Total Out</h3>
            <p id="total-out" style="color: var(--accent-exit);">0</p>
        </div>
    </div>

    <div class="log-container" id="activity-log">
        <div style="color: var(--secondary-text); text-align: center; padding: 20px;">System Ready. Listening for data...</div>
    </div>
</div>

<script>
    let occupancy = 0;
    let totalIn = 0;
    let totalOut = 0;

    function updateDisplay() {
        document.getElementById('current-occupancy').innerText = occupancy;
        document.getElementById('total-in').innerText = totalIn;
        document.getElementById('total-out').innerText = totalOut;
    }

    function addLog(type) {
        const log = document.getElementById('activity-log');
        // Clear initial message on first action
        if (totalIn + totalOut === 1) log.innerHTML = ''; 

        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        
        const item = document.createElement('div');
        item.className = 'log-item';
        const tagClass = type === 'ENTRY' ? 'tag-entry' : 'tag-exit';
        
        item.innerHTML = `
            <span><span class="tag ${tagClass}">${type}</span> detected</span>
            <span style="color: var(--secondary-text)">${timeStr}</span>
        `;
        
        log.prepend(item);
    }

    /**
     * TRIGGER FUNCTIONS
     * Use these functions to update the UI from your external script or sensor.
     */
    function triggerEntry() {
        occupancy++;
        totalIn++;
        addLog('ENTRY');
        updateDisplay();
    }

    function triggerExit() {
        if (occupancy > 0) {
            occupancy--;
            totalOut++;
            addLog('EXIT');
            updateDisplay();
        }
    }

    // Clock display
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleString();
    }, 1000);
</script>

</body>
</html>
